[package]
name = "vocab-tts"
description = "Neural text-to-speech service of the vocabulary app (Kokoro via sherpa-onnx, MP3 out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vocab-tts"
path = "src/main.rs"

[dependencies]
axum.workspace = true
ebur128.workspace = true
hex.workspace = true
hyper.workspace = true
hyper-util.workspace = true
mp3lame-encoder.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-normalization.workspace = true
vocab-pack.workspace = true

# The engine links the sherpa-onnx static libraries; only builds with
# RUSTFLAGS="--cfg vocab_tts_engine" (docker/Dockerfile.tts) have it, so the
# workspace builds and tests offline (src/engine.rs).
[target.'cfg(vocab_tts_engine)'.dependencies]
sherpa-onnx.workspace = true

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true
