[package]
name = "vocab-server"
description = "Vocabulary training app: HTTP API, single-page frontend and SQLite store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vocab-server"
path = "src/main.rs"

[dependencies]
argon2.workspace = true
axum.workspace = true
fsrs.workspace = true
getrandom.workspace = true
hex.workspace = true
httparse.workspace = true
# channel: the full export streams its rows through a body channel.
http-body-util = { workspace = true, features = ["channel"] }
hyper.workspace = true
hyper-util.workspace = true
include_dir.workspace = true
jiff.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
# The full export is spooled to an anonymous temporary file next to the
# database (design §8.1).
tempfile.workspace = true
thiserror.workspace = true
# io-util: the TTS client (`audio`) reads and writes its own HTTP/1.1.
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
vocab-pack.workspace = true

[dev-dependencies]
# io-util: AsyncRead/AsyncWrite helpers for raw-socket connection tests.
tokio = { workspace = true, features = ["io-util"] }
tower.workspace = true

[lints]
workspace = true
