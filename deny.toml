# cargo-deny (pinned 0.20.2 in CI): advisories, licences, bans, sources.
# Licence exceptions of `vocab-tts` (LAME, and the build-time downloader of
# sherpa-onnx-sys) are scoped to the crates concerned (see [licenses]).

[graph]
all-features = true
# No target filter: every platform's crates are checked (a superset of
# what ships). vocab-tts's engine dependency sits behind
# `cfg(vocab_tts_engine)` (crates/vocab-tts/src/engine.rs), which a target
# list cannot express; with a filter it would not be checked at all.

[advisories]
# Advisories are reported, but updates still respect the 14-day rule (R-90):
# a fix only lands once its release is old enough.
yanked = "deny"
ignore = [
    # `url` 2.5.8: stack overflow in `Url::origin()` on nested `blob:` URLs.
    # Here `url` comes only from `ureq`, a BUILD dependency of
    # `sherpa-onnx-sys` (its build script's downloader): it is in no shipped
    # binary, and no build downloads anything (SHERPA_ONNX_LIB_DIR points at
    # the checksum-verified libraries), so the function never sees untrusted
    # input. The fix, `url` 2.5.9, was published 2026-11-20 and may be used
    # from 2026-12-05 (14-day rule, R-90): update then and remove this entry.
    { id = "RUSTSEC-2026-0592", reason = "build-only dependency of sherpa-onnx-sys; fixed release is younger than 14 days until 2026-12-05" },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    # MIT without the attribution clause (more permissive than MIT). Only
    # `borrow-or-share`, pulled in by the `jsonschema` dev-dependency (M2
    # schema conformance test); it is not part of any shipped binary.
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# `priority-queue` (pulled in by `fsrs`, design §16.1) is dual-licensed
# "LGPL-3.0-or-later OR MPL-2.0"; we take MPL-2.0. MPL is file-level
# copyleft: it covers only that crate's own (public, unmodified) sources, not
# the rest of the binary. Scoped to this one crate.
exceptions = [
    { allow = ["MPL-2.0"], crate = "priority-queue" },
    # LAME and its Rust bindings, linked into vocab-tts only (design §10.1;
    # the TTS image carries their licence texts in /licenses). "LGPL-3.0" is
    # the crates' own (deprecated) identifier.
    { allow = ["LGPL-3.0"], crate = "mp3lame-encoder" },
    { allow = ["LGPL-3.0"], crate = "mp3lame-sys" },
    # Build dependencies of sherpa-onnx-sys only: its build script can
    # download (ureq, rustls) and unpack (zip, bzip2) prebuilt libraries.
    # None of them is in a shipped binary, and no build downloads anything:
    # SHERPA_ONNX_LIB_DIR points at the checksum-verified libraries
    # (docs/design/tts-spike.md, "Building").
    { allow = ["ISC"], crate = "ring" },
    { allow = ["ISC"], crate = "rustls-webpki" },
    { allow = ["ISC"], crate = "untrusted" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
]

[licenses.private]
# The workspace crates themselves are MIT (see LICENSE) and never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
