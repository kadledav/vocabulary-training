# cargo-deny (pinned 0.20.2 in CI): advisories, licences, bans, sources.
# Licence exceptions for the GPL/LGPL parts of `vocab-tts` (espeak-ng via
# sherpa-onnx, LAME) are added with that crate in M6, scoped to it only.

[graph]
all-features = true
# Only platforms we build for: the musl release binaries (amd64, arm64), CI,
# the owner's Mac.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
# Advisories are reported, but updates still respect the 14-day rule (R-90):
# a fix only lands once its release is old enough.
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    # MIT without the attribution clause (more permissive than MIT). Only
    # `borrow-or-share`, pulled in by the `jsonschema` dev-dependency (M2
    # schema conformance test); it is not part of any shipped binary.
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# `priority-queue` (pulled in by `fsrs`, design §16.1) is dual-licensed
# "LGPL-3.0-or-later OR MPL-2.0"; we take MPL-2.0. MPL is file-level
# copyleft: it covers only that crate's own (public, unmodified) sources, not
# the rest of the binary. Scoped to this one crate.
exceptions = [
    { allow = ["MPL-2.0"], crate = "priority-queue" },
]

[licenses.private]
# The workspace crates themselves are MIT (see LICENSE) and never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
