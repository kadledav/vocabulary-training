# Release (design §12.4, §14.2), on a tag vX.Y.Z:
#
# 1. prepare: the tag is exactly vMAJOR.MINOR.PATCH, equals the workspace
#    version in Cargo.toml and its commit is on main; if the version tag
#    already exists in GHCR (a re-run), nothing is built again.
# 2. checks: every CI check (ci.yml).
# 3. image-amd64 / image-arm64: each platform is built ONCE, natively on its
#    own runner (no QEMU), with SLSA provenance (mode=max) and an SBOM,
#    pushed by digest only (untagged), pulled back and smoke-tested there
#    (release-image.yml).
# 4. publish: the two tested images are merged into one multi-platform index
#    `sha-<short>` (no rebuild) and the version tag X.Y.Z is added to that
#    index; an existing version tag is never moved. Never `latest`.
# 5. notes: the reference `X.Y.Z@digest` goes into the job summary and,
#    once, into the GitHub release notes. Deploy by tag AND digest.
#
# Every action is pinned by commit SHA, the BuildKit and SBOM-generator images
# by digest; tools/dep-age.py dates all of them (R-90).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: tag, version, main, registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      number: ${{ steps.prepare.outputs.version }}
      short: ${{ steps.prepare.outputs.short }}
      existing: ${{ steps.prepare.outputs.existing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All branches: the tagged commit must be an ancestor of origin/main.
          fetch-depth: 0
      - name: Check the tag, its commit and whether the version is published
        id: prepare
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release-promote.py prepare --repository ghcr.io/kadledav/vocabulary-training --tag "$TAG" --commit "$COMMIT"

  checks:
    name: CI checks
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  image-amd64:
    name: image linux/amd64
    needs: [prepare, checks]
    if: needs.prepare.outputs.existing == ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      platform: linux/amd64
      runner: ubuntu-24.04
      number: ${{ needs.prepare.outputs.number }}

  image-arm64:
    name: image linux/arm64
    needs: [prepare, checks]
    if: needs.prepare.outputs.existing == ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      platform: linux/arm64
      runner: ubuntu-24.04-arm
      number: ${{ needs.prepare.outputs.number }}

  publish:
    name: merge the tested images, tag X.Y.Z
    needs: [prepare, image-amd64, image-arm64]
    if: needs.prepare.outputs.existing == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One index sha-<short> of both tested images, then the version tag
        id: publish
        env:
          NUMBER: ${{ needs.prepare.outputs.number }}
          SHORT: ${{ needs.prepare.outputs.short }}
          AMD64: ${{ needs.image-amd64.outputs.digest }}
          ARM64: ${{ needs.image-arm64.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release-promote.py publish --repository ghcr.io/kadledav/vocabulary-training --version "$NUMBER" --short "$SHORT" --digest "$AMD64" --digest "$ARM64"

  notes:
    name: digest into the release notes
    needs: [prepare, publish]
    # Also on a re-run of an already published version (publish skipped).
    if: always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.prepare.outputs.existing != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reference tag and digest in the summary and the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NUMBER: ${{ needs.prepare.outputs.number }}
          DIGEST: ${{ needs.publish.outputs.digest || needs.prepare.outputs.existing }}
        run: python3 tools/release-promote.py notes --repository ghcr.io/kadledav/vocabulary-training --tag "$TAG" --version "$NUMBER" --digest "$DIGEST"
