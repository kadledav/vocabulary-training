# CI (design §14.2). Every action is pinned by commit SHA with its release tag
# in a trailing comment; tools/dep-age.py checks that each tag points to the
# pinned SHA and that its release is at least 14 days old (R-90).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks before it publishes an image.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  guards:
    name: guards (dep-age, repo-guard, cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-tests of the guard tools
        run: python3 -m unittest discover -s tools/tests -v
      - name: Dependency age gate (R-90)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/dep-age.py
      - name: Repository guard (R-24, R-84, R-92, R-95)
        run: python3 tools/repo-guard.py
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-deny
        # --locked: build with cargo-deny's own published lock file, whose
        # crates are all older than the cargo-deny release itself.
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny (advisories, licences, bans, sources)
        run: cargo deny --locked check

  rust:
    name: rust (fmt, clippy, test)
    # Nothing is built or run before the age gate and guards have passed.
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  web:
    name: web (typecheck, unit tests)
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Install dev dependencies from the lock file (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Type-check the frontend (tsc --noEmit, checkJs)
        run: npm run typecheck
      - name: Unit tests of the frontend logic (node --test)
        run: npm run test

  e2e:
    name: e2e (Playwright, WebKit phone + Chromium desktop)
    needs: guards
    # macOS: Playwright's WebKit runs there without extra OS packages, so
    # nothing outside the lock files is installed (no OS packages).
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build the server the tests start
        run: cargo build --locked -p vocab-server
      - name: Install dev dependencies from the lock file (no lifecycle scripts)
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Browsers of the locked Playwright version
        working-directory: web
        run: npx --no-install playwright install chromium webkit
      - name: Playwright tests
        working-directory: web
        env:
          CI: "true"
        run: npm run e2e

  image-smoke:
    name: image (build, smoke tests R-83)
    # Nothing is built or run before the age gate and guards have passed.
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The builder built into the runner: no BuildKit image is pulled; the base
      # images and Debian packages are the pinned ones of the Dockerfile.
      - name: Build the image (loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.server
          load: true
          push: false
          provenance: false
          sbom: false
          tags: vocab-server:ci
      - name: Smoke tests (read-only, no capabilities, non-root, no shell, login)
        run: python3 tools/image-smoke.py vocab-server:ci
