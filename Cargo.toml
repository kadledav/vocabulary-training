[workspace]
resolver = "3"
members = ["crates/vocab-pack", "crates/vocab-server", "crates/vocab-tts"]
# `vocab-tts` is a member but not a default member, so that a plain `cargo
# build` does not need the sherpa-onnx static libraries (design §14.1,
# docs/design/tts-spike.md, "Building").
default-members = ["crates/vocab-pack", "crates/vocab-server"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Every version is an exact pin (R-90). Renovate bumps them (rangeStrategy
# "bump") only after the 14-day minimum release age; `tools/dep-age.py`
# checks the whole Cargo.lock, transitive crates included.
[workspace.dependencies]
# Password hashing and verification (design §9.1): argon2id PHC strings. Default features
# off: salts come from `getrandom` directly, no `rand_core`/`getrandom` 0.3.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
# `query`: query-string parameters of the read endpoints (design §8).
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query"] }
# FSRS-6 scheduler (design §6.1). Default features off: the optimiser is
# part of the default build already; `experimental_cost_adr` is not used.
fsrs = { version = "=6.6.2", default-features = false }
# Random practice-session ids (design §4.2 `practice_session.id`).
getrandom = "=0.4.3"
hex = "=0.4.3"
# Reading request bodies frame by frame (import body limit with draining).
http-body-util = "=0.1.5"
# The server loop uses hyper directly for connection-level limits (header read
# timeout, connection cap) that `axum::serve` does not expose.
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["http1", "server", "server-graceful", "service", "tokio"] }
include_dir = "=0.7.4"
# The format library of this workspace (design §3.1).
vocab-pack = { path = "crates/vocab-pack" }
jiff = { version = "=0.2.39", default-features = false, features = ["std", "tzdb-bundle-always"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Safe `umask` (the workspace forbids `unsafe`) and `O_NOFOLLOW` for the
# write probe of the data directories; already in the lock file via tempfile.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
# vocab-tts (design §10, §16.2): the TTS engine (Kokoro through the
# sherpa-onnx C API, statically linked; the default `static` feature only),
# EBU R128 loudness and the LAME MP3 encoder.
sherpa-onnx = "=2.0.1"
ebur128 = "=0.1.11"
mp3lame-encoder = "=0.2.5"
# Constant-time comparison of connector token and setup code digests (design §9).
subtle = "=2.6.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
# NFC normalisation for identity keys and stored text (design §5.3).
unicode-normalization = "=0.1.26"
# dev-dependencies
# Schema <-> importer conformance test (design §5.2). Default features off:
# no HTTP/file resolving of $refs, the schema is self-contained.
jsonschema = { version = "=0.60.2", default-features = false }
tempfile = "=3.27.0"
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# `vocab_tts_engine`: vocab-tts with the sherpa-onnx engine (src/engine.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vocab_tts_engine)"] }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Password hashing is expensive on purpose (argon2id, 19 MiB); unoptimised it
# takes seconds, which every test that logs in would pay. Only these crates
# are optimised in dev/test builds; release builds optimise everything anyway.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
