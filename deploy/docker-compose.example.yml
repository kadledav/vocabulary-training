# Compose stack of the vocabulary app (design §12.2, R-80, R-81, R-83, R-85).
# Copy to your deployment repo, e.g. as docker/vocabulary/docker-compose.yml,
# and replace the placeholders (`tank` pool, `proxy-net` network, `home`
# entrypoint, host name, user ID) with your own. No .env and
# no secrets: the password is set in the app on first start (setup code in
# `docker logs vocabulary`, see README.md). Set both `image:` lines to the tag
# AND digest printed in the release notes. The TTS service (M6) is reachable
# only from the app, on the internal network `vocab-internal`.
name: vocabulary

services:
  vocabulary:
    container_name: vocabulary
    image: ghcr.io/kadledav/vocabulary-training:X.Y.Z@sha256:DIGEST-FROM-THE-RELEASE-NOTES
    restart: unless-stopped
    # The user and group that own the dataset, e.g. 3101:3101 (see
    # README.md); use your own IDs.
    user: "3101:3101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      # Configuration (no config file). Exact origin: no path, no trailing
      # slash, no default port.
      - VOCAB_PUBLIC_ORIGIN=https://vocab.example.home
      - VOCAB_TIMEZONE=Europe/Prague
      - VOCAB_DAY_ROLLOVER_HOUR=4
      - VOCAB_LOG_LEVEL=info
      # Neural audio (v0.2.0): the TTS service below, on vocab-internal.
      # Remove the line to go back to the browser's own speech.
      - VOCAB_TTS_URL=http://vocabulary-tts:8090
    volumes:
      # The dataset root: the database, and the cache in /data/cache (made by
      # the app).
      - /mnt/tank/services/vocabulary:/data
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/vocab-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - proxy-net
      # Only to reach vocabulary-tts (no route anywhere else).
      - vocab-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.services.vocabulary-svc.loadbalancer.server.port=8080"
      # Your reverse proxy's LAN-only entrypoint ONLY ('home' here: LAN +
      # VPN). Never add a
      # 'websecure' router: a router without an explicit entrypoints label
      # would attach to ALL entrypoints, including the public one.
      - "traefik.http.routers.vocabulary-home.rule=Host(`vocab.example.home`)"
      - "traefik.http.routers.vocabulary-home.entrypoints=home"
      - "traefik.http.routers.vocabulary-home.service=vocabulary-svc"
      - "traefik.http.routers.vocabulary-home.tls=true"
    # No ports:, no Docker socket, no host network, no devices.

  # Neural TTS (design §10, R-40, R-83): turns words and sentences into MP3
  # clips for the app. The Kokoro model is in the image (read-only); no
  # volumes, no ports, no route to the LAN or the internet.
  vocabulary-tts:
    container_name: vocabulary-tts
    image: ghcr.io/kadledav/vocabulary-training-tts:X.Y.Z@sha256:DIGEST-FROM-THE-RELEASE-NOTES
    restart: unless-stopped
    user: "3101:3101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Inference threads; keep equal to `cpus`.
      - VOCAB_TTS_THREADS=2
      - VOCAB_TTS_LOG_LEVEL=info
    # Measured peak ~0.9 GB for the longest text (docs/design/tts-spike.md).
    mem_limit: 1280m
    memswap_limit: 1280m
    cpus: 2.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/vocab-tts", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Loading the model and the start self-test take a few seconds.
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - vocab-internal
    # No ports:, no volumes:, no Docker socket, no host network, no devices.

networks:
  proxy-net:
    external: true
  # The app and the TTS service only; `internal: true` = no gateway, so no
  # traffic to the LAN or the internet.
  vocab-internal:
    internal: true
