# Compose stack of the vocabulary app (design §12.2, R-80, R-81, R-83, R-85).
# Copy to the home repo as docker/vocabulary/docker-compose.yml, next to a
# .env made from .env.example. Set `image:` to the tag AND digest printed in
# the release notes (see README.md). The TTS service joins in M6.
name: vocabulary

services:
  vocabulary:
    container_name: vocabulary
    image: ghcr.io/kadledav/vocabulary-training:X.Y.Z@sha256:DIGEST-FROM-THE-RELEASE-NOTES
    restart: unless-stopped
    # The owner's TrueNAS user and group (owner of data/ and cache/, see
    # README.md); change the second number if your group ID differs.
    user: "3101:3101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      # Configuration (no config file). Exact origin: no path, no trailing
      # slash, no default port.
      - VOCAB_PUBLIC_ORIGIN=https://vocab.example.home
      - VOCAB_TIMEZONE=Europe/Prague
      - VOCAB_DAY_ROLLOVER_HOUR=4
      - VOCAB_LOG_LEVEL=info
      # Secrets from .env (README.md §2).
      - VOCAB_PASSWORD_HASH_B64=${VOCAB_PASSWORD_HASH_B64:?set in .env}
      - VOCAB_IMPORT_TOKEN=${VOCAB_IMPORT_TOKEN:?set in .env}
    volumes:
      - /mnt/tank/services/vocabulary/data:/data
      - /mnt/tank/services/vocabulary/cache:/cache
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/vocab-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.services.vocabulary-svc.loadbalancer.server.port=8080"
      # 'home' entrypoint ONLY (LAN + VPN). Never add a
      # 'websecure' router: a router without an explicit entrypoints label
      # would attach to ALL entrypoints, including the public one.
      - "traefik.http.routers.vocabulary-home.rule=Host(`vocab.example.home`)"
      - "traefik.http.routers.vocabulary-home.entrypoints=home"
      - "traefik.http.routers.vocabulary-home.service=vocabulary-svc"
      - "traefik.http.routers.vocabulary-home.tls=true"
    # No ports:, no Docker socket, no host network, no devices.

networks:
  proxy-net:
    external: true
